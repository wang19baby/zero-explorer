[package]
name = "zero_explorer"
version = "0.1.0"
edition = "2021"
description = "A modern file explorer built with Rust and GPU acceleration"
authors = ["Zero Explorer Team"]

[dependencies]
# Window management
winit = "0.29"

# GPU rendering
wgpu = "0.19"
pollster = "0.3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Date/Time
chrono = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
# Testing
tempfile = "3"
