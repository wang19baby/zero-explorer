[package]
name = "zero_explorer"
version = "0.1.0"
edition = "2021"
description = "A modern file explorer built with Rust and GPU acceleration"
authors = ["Zero Explorer Team"]

[dependencies]
# Window management
winit = "0.29"

# GPU rendering
wgpu = "0.19"
pollster = "0.3"
bytemuck = { version = "1.14", features = ["derive"] }

# Text rendering
glyph_brush = "0.7"
ab_glyph = "0.2"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Date/Time
chrono = "0.4"

# Logging
log = "0.4"
env_logger = "0.11"
fern = "0.7"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# SVG rendering
resvg = "0.44"
usvg = "0.44"

# LRU cache for icons and glyphs
lru = "0.12"

# Crossbeam channels for bounded communication
crossbeam-channel = "0.5"

# Windows API for Shell icons and system theme
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
# Testing
tempfile = "3"
